<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profileCard">
        <div class="profile">
            <img src="https://placehold.co/100x100" alt="" id="profileImage">
        <h2 id="profileName">John Doe</h2>
        </div>
        <p id="profileRole">Software Developer</p>
        <p id="profileBio">Passionate about coding and learning new technologies.</p>
        <button id="updateNameBtn">Update Name</button>
        <button id="updateRoleBtn">Update Role</button>
        <button id="toggleStatusBtn" class="active-status">Toggle Status</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
